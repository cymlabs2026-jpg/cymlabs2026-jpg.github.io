<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<style>
{{css}}
/* Se diseña a 1920x1080 y se reduce a 1280x720 al exportar.
   Reglas: máximo cuatro palabras, un solo foco visual, legible en el celular. */
.texto { position: absolute; left: 90px; top: 0; bottom: 0; width: 820px; display: flex; flex-direction: column; justify-content: center; z-index: 2; }
.titular { font-size: 138px; line-height: 1; }
.titular .acento { background: var(--degradado); -webkit-background-clip: text; background-clip: text; color: transparent; }
.barra { width: 360px; height: 22px; margin-top: 52px; }
.foco {
  /* Marco en 16:9, la misma proporción del video, para no recortar el foco. */
  position: absolute; right: 60px; top: 50%; width: 980px; aspect-ratio: 16 / 9; margin-top: -276px; z-index: 1;
  border-radius: 36px; padding: 10px; background: var(--degradado);
  box-shadow: 0 40px 80px rgba(11, 18, 32, 0.28);
  transform: rotate(2deg);
}
.foco .marco { width: 100%; height: 100%; border-radius: 28px; overflow: hidden; background: #fff; }
.foco img { width: 100%; height: 100%; object-fit: cover; display: block; }
.logo { position: absolute; left: 90px; bottom: 60px; width: 300px; z-index: 2; }
</style>
</head>
<body>
  <div class="texto">
    <h1 class="titular">{{texto}}</h1>
    <div class="barra"></div>
  </div>
  <div class="foco"><div class="marco"><img src="{{foco}}" alt=""></div></div>
  <div class="logo">{{logo}}</div>
</body>
</html>
